[project]
name = "lemon2pdf"
version = "0.1.0"
description = "Convert LEMON offline service-manual ZIP exports into navigable, sectioned PDFs."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Seth Barrett", email = "sethbarrett01@gmail.com" }]
requires-python = ">=3.11"
keywords = ["pdf", "service-manual", "lemon", "automotive", "converter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "pillow>=10,<13",
    "pymupdf>=1.24,<2",
    "reportlab>=4.2,<6",
]

[project.scripts]
lemon2pdf = "lemon2pdf.cli:main"

[project.urls]
Homepage = "https://github.com/sethbarrett50/service-manual-conversion"
Repository = "https://github.com/sethbarrett50/service-manual-conversion"
Issues = "https://github.com/sethbarrett50/service-manual-conversion/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15",
    "ty>=0.0.80",
    "types-reportlab>=5.0.0.20261008",
]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "LOG", "G", "PL", "ANN"]
ignore = ["PLR0913", "PLR0917", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR"]

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
